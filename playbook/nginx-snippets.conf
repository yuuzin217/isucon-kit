# nginx スニペット集
#
# 使い方: 該当部分を当日の nginx.conf / サイト設定にコピーして調整する。
# 変更後は必ず `nginx -t` を通してから reload / restart する。
# 再現性チェック対策として、編集は設定ファイル自体に行う（コマンドラインでの一時的変更は残らない）。

# ---- alp 用 log_format（isucon-kit の analyzer 前提） ----
# request_time / upstream_response_time が無いと alp で「どこが遅いか」が見えない。
# JSON 形式（isucon-kit は json / ltsv に対応）
log_format json_combined escape=json
  '{"time":"$time_iso8601",'
  '"host":"$host",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes":$body_bytes_sent,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent",'
  '"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time"}';

# access_log /var/log/nginx/access.log json_combined;

# ---- 静的ファイルはアプリを通さず nginx から配信 ----
# アプリの静的配信が遅い場合の定番。パスは当日の構成に合わせる。
# location /static/ {
#     alias /home/isucon/webapp/public/;
#     expires 1h;
#     access_log off;
# }

